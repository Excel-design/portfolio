<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="description" content="Portfolio proyek web, IoT, dan keamanan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <a href="#home" class="logo">&lt;dev/&gt;</a>
    <nav>
      <a href="#skills">Skill</a>
      <a href="#projects">Proyek</a>
      <a href="#contact">Kontak</a>
      <button id="themeToggle" class="icon-btn" aria-label="Ganti tema">🌙</button>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <p class="hello">Halo, saya</p>
      <h1 id="name"></h1>
      <p id="bio" class="bio"></p>
      <div class="cta">
        <a class="btn primary" href="#projects">Lihat Proyek</a>
        <a id="githubLink" class="btn" href="#" target="_blank" rel="noopener" hidden>GitHub</a>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><strong id="statProjects">0</strong><span>Proyek</span></div>
      <div class="stat"><strong id="statCats">0</strong><span>Kategori</span></div>
      <div class="stat"><strong id="statTech">0</strong><span>Teknologi</span></div>
    </section>

    <section id="skills" class="section">
      <h2>Skill &amp; Teknologi</h2>
      <div id="skillList" class="chips"></div>
    </section>

    <section id="projects" class="section">
      <h2>Proyek</h2>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Cari proyek..." />
        <div id="filters" class="filters"></div>
      </div>
      <div id="projectGrid" class="grid"></div>
      <p id="empty" class="empty" hidden>Tidak ada proyek yang cocok.</p>
    </section>

    <section id="contact" class="section contact">
      <h2>Mari terhubung</h2>
      <p>Tertarik berkolaborasi atau punya pertanyaan? Hubungi saya.</p>
      <a id="contactLink" class="btn primary" href="#" target="_blank" rel="noopener" hidden>Hubungi saya</a>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span id="footerName"></span>. Dibuat dengan HTML, CSS &amp; JavaScript.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
